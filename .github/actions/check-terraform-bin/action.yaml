name: Check Terraform binary

runs:
  using: composite
  steps:
    - name: Check if Terraform binary exists
      id: terraform-bin
      run: |
        if [ -e output/terraform/bin ]; then 
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
      shell: bash
    - name: Download Terraform binary
      if: steps.terraform-bin.outputs.exists != true
      uses: actions/download-artifact@v4
      with:
        name: terraform-bin