name: Check Terraform init

outputs:
  exists:
    value: ${{ steps.terraform-init.outputs.exists }}

runs:
  using: composite
  steps:
    - name: Download Terraform init files
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: terraform-init
        path: output/terraform/init
    - name: Check if Terraform init files exist
      id: terraform-init
      run: |
        if [ -e output/terraform/init ]; then 
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Terraform init files already exist..."
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "Terraform init files do not exist..."
        fi
      shell: bash